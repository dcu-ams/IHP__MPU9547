LINTER_INCLUDE_PDK_MODELS: true


DESIGN_NAME: tv80s
VERILOG_FILES:
- dir::../src/tv80s.v
- dir::../src/tv80_core.v
- dir::../src/tv80_alu.v
- dir::../src/tv80_reg.v
- dir::../src/tv80_mcode.v


VERILOG_DEFINES: [FUNCTIONAL]

# Enable plugin for better SystemVerilog support
# USE_SLANG: True
# SLANG_ARGUMENTS: ['--keep-hierarchy']

# Slightly smaller file sizes
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# SDC files
PNR_SDC_FILE: dir::block.sdc
SIGNOFF_SDC_FILE: dir::block.sdc
FALLBACK_SDC: dir::block.sdc

# Power / ground nets
VDD_NETS:
- VDD
GND_NETS:
- VSS

# Clock
CLOCK_NET: clk
CLOCK_PORT: clk
# 50 ns equivalent to 20 MHz
CLOCK_PERIOD: 50

# Timing - default
# 
# Placement (default 0.1 ns) 0.3
PL_RESIZER_HOLD_SLACK_MARGIN: 0.1
# Global routing (default 0.05 ns) 0.15
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.05


# Trying to by margin with these settings
#
# Set the cap to 0.8 pF to force buf_8 instantiation
OUTPUT_CAP_LOAD: 800
# Tighten up on transistion from PDK default of 1.5 to 2 ns  (0.5)
# MAX_TRANSITION_CONSTRAINT: 0.5
# Tighten up on transistion from PDK default of 0.15 ns to 0.1 ns
# Probably overkill for the clock frequencies we are likely to use
# CLOCK_TRANSITION_CONSTRAINT: 0.1


# Floorplanning
FP_SIZING: absolute
DIE_AREA: [0, 0, 509, 406]
CORE_AREA: [5, 5, 504, 401]
# with PDN_CORE_RING
#DIE_AREA: [0, 0, 500, 400]
#CORE_AREA: [50, 50, 450, 350]
IO_PIN_ORDER_CFG: dir::pins.cfg

# Increase for more logic
# on your die
PL_TARGET_DENSITY_PCT: 50
GRT_ALLOW_CONGESTION: false
# RT_MAX_LAYER: "Metal4"

# PDN 
PDN_CFG: dir::pdn_cfg.tcl
#PDN_CORE_RING: false
#PDN_CORE_RING_VWIDTH: 1    
#PDN_CORE_RING_VSPACING: 2
#PDN_CORE_RING_HWIDTH: 2
#PDN_CORE_RING_HSPACING: 4
PDN_HWIDTH: 2
PDN_HSPACING: 4
PDN_HPITCH: 55
PDN_HOFFSET: 0
PDN_VWIDTH: 1
PDN_VSPACING: 2
PDN_VPITCH: 55
PDN_VOFFSET: 0


#PDN_CORE_RING_CONNECT_TO_PADS: false
#PDN_ENABLE_PINS: true


